<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly Planner</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="app"><header><h1>Weekly Planner</h1><div class="week-nav"><button id="prev">‹</button><b id="weekLabel"></b><button id="next">›</button></div><div class="header-actions"><button id="today">Today</button><button id="backup">Backup</button><button id="restoreBackup">Restore Backup</button><input id="restoreFile" type="file" accept="application/json,.json" hidden></div></header>
<div class="top"><section class="card priorities"><h2>Top Priorities</h2><div class="sub">Choose up to 4 main priorities for this week.</div><div id="priorityList"></div><button id="addPriority">＋ Add priority</button></section>
<section class="card next"><h2>To Do</h2><div class="sub">Keep track of tasks and move them forward when needed.</div><div id="nextList" class="list"></div><button id="addNext">＋ Add item</button></section></div>
<section class="card schedule"><div class="head"><div><h2>Weekly Schedule</h2><div class="sub" id="scheduleSub">Plan your week around meetings and priority work.</div></div><button id="addSchedule">＋ Add item</button></div>
<div class="timeline"><div class="time-row"><div></div><div class="scale" id="scale"></div></div><div id="scheduleBody"></div></div></section>
<section class="card goals"><h2>Weekly Goals</h2><div class="sub">What do you want to achieve this week?</div><div id="goalList" class="list"></div><button id="addGoal">＋ Add goal</button></section></div>
<div class="overlay" id="modal"><div class="modal"><h3 id="modalTitle"></h3><div id="modalFields"></div><div class="error" id="modalError"></div><div class="actions" id="modalActions"></div></div></div>
<script type="module" src="js/app.js"></script></body></html>
